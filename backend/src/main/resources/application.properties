# =====================================================================
# Smart Parking Management System - Application Configuration
# =====================================================================
# This file tells Spring Boot how to connect to MySQL and configure the app.
# Spring Boot reads this file automatically at startup.
# =====================================================================

# ---- Server Configuration ----
# The port on which our backend will run
# Frontend will call APIs at http://localhost:8080/api/...
server.port=8080

# ---- MySQL Database Configuration ----
# URL format: jdbc:mysql://host:port/database_name?options
# Make sure MySQL is running and the database 'smart_parking_db' is created
spring.datasource.url=jdbc:mysql://localhost:3306/smart_parking_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---- JPA / Hibernate Configuration ----
# hibernate.ddl-auto: Controls how JPA manages the database schema
# 'update' = Create tables if they don't exist, update if schema changes
# For production use 'validate' or 'none'. For development 'update' is fine.
spring.jpa.hibernate.ddl-auto=update

# Show SQL queries in the console (useful for debugging during development)
spring.jpa.show-sql=true

# Format the SQL nicely in console output
spring.jpa.properties.hibernate.format_sql=true

# Tell Hibernate to use MySQL 8 dialect (set of SQL commands specific to MySQL)
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# ---- Application Name ----
spring.application.name=smart-parking-backend

# ---- Logging ----
# Show INFO level logs for our app, WARN level for Spring internals
logging.level.com.smartparking=DEBUG
logging.level.org.springframework.web=INFO

# ---- JSON Serialization ----
# Entities use LAZY relationships (user, vehicle, slot...). Hibernate wraps them in
# proxy objects, and Jackson fails with "No serializer found for ByteBuddyInterceptor"
# unless we allow empty beans. This makes all /api responses serialize correctly.
spring.jackson.serialization.fail-on-empty-beans=false
